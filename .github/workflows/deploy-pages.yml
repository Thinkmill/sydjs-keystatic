name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove server-only Keystatic routes
        run: |
          rm -rf 'src/app/keystatic/[[...params]]'
          rm -rf 'src/app/api/keystatic/[...params]'

      - name: Build static site
        run: pnpm build
        env:
          STATIC_EXPORT: 'true'

      # Only when a PR preview workflow asks us to republish. A push to main
      # deploys production alone and drops any previously composed previews.
      - name: Include PR preview sites
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages --depth=1
            if git archive origin/gh-pages pr-preview >/tmp/pr-preview.tar 2>/dev/null; then
              rm -rf out/pr-preview
              mkdir -p out
              tar -x -f /tmp/pr-preview.tar -C out
              echo "Included $(find out/pr-preview -mindepth 1 -maxdepth 1 -type d | wc -l) PR preview(s)"
            else
              echo "gh-pages has no pr-preview directory yet"
            fi
          else
            echo "No gh-pages branch yet; skipping previews"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
